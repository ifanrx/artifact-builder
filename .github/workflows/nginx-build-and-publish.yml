name: nginx / Build And Publish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nginx-build-and-publish.yml"
      - "nginx/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      nginx_version:
        description: Optional nginx version to build instead of auto-detecting
        required: false
        type: string
      publish:
        description: Upload artifacts to the GitHub Release for this nginx version
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nginx-build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Check nginx release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      nginx_version: ${{ steps.check.outputs.nginx_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve target nginx version
        id: check
        env:
          NGINX_VERSION_OVERRIDE: ${{ inputs.nginx_version }}
        run: ./nginx/scripts/check-nginx-release.sh

  build:
    name: Build (${{ matrix.distro }})
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jammy
            runner: ubuntu-22.04
            verify_package: false
          - distro: noble
            runner: ubuntu-24.04
            verify_package: false
          - distro: resolute
            runner: ubuntu-26.04
            verify_package: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DISTRO: ${{ matrix.distro }}
      NGINX_VERSION: ${{ needs.check-release.outputs.nginx_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./nginx/scripts/install-build-deps.sh

      - name: Fetch sources
        run: ./nginx/scripts/fetch-sources.sh "${RUNNER_TEMP}/build/${DISTRO}" "${NGINX_VERSION}"

      - name: Build LuaJIT archive
        run: ./nginx/scripts/build-luajit-artifact.sh "${RUNNER_TEMP}/build/${DISTRO}" "${DISTRO}" "${RUNNER_TEMP}/output/${DISTRO}"

      - name: Build nginx modules
        run: ./nginx/scripts/build-nginx-modules.sh "${RUNNER_TEMP}/build/${DISTRO}" "${NGINX_VERSION}" "${RUNNER_TEMP}/output/${DISTRO}"

      - name: Verify nginx module linkage
        run: ./nginx/scripts/verify-nginx-modules.sh "${RUNNER_TEMP}/output/${DISTRO}/modules"

      - name: Verify official nginx.org compatibility
        if: matrix.verify_package
        run: ./nginx/scripts/verify-nginx-package.sh "${RUNNER_TEMP}/build/${DISTRO}" "${NGINX_VERSION}" "${DISTRO}" "${RUNNER_TEMP}/output/${DISTRO}"

      - name: Write build manifest
        run: ./nginx/scripts/write-build-manifest.sh "${RUNNER_TEMP}/build/${DISTRO}" "${NGINX_VERSION}" "${DISTRO}" "${RUNNER_TEMP}/output/${DISTRO}/build-manifest.env"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: nginx-build-${{ matrix.distro }}
          path: ${{ runner.temp }}/output/${{ matrix.distro }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - check-release
      - build
    if: |
      needs.build.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'push' ||
        inputs.publish == true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NGINX_VERSION: ${{ needs.check-release.outputs.nginx_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/downloads

      - name: Package release assets
        run: ./nginx/scripts/package-release-assets.sh "${RUNNER_TEMP}/downloads" "${RUNNER_TEMP}/release-assets"

      - name: Publish GitHub Release assets
        run: ./nginx/scripts/publish-github-release.sh "${RUNNER_TEMP}/release-assets" "${NGINX_VERSION}"

      - name: Update tracked nginx version
        if: github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          printf '%s\n' "${NGINX_VERSION}" > nginx/versions/nginx-version.txt

          if git diff --quiet -- nginx/versions/nginx-version.txt; then
            echo "Tracked nginx version is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nginx/versions/nginx-version.txt
          git commit -m "chore(nginx): track nginx ${NGINX_VERSION} [skip ci]"
          git push origin HEAD:main
